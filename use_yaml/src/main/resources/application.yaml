spring:
  application:
    name: use_yaml

  profiles:
#    한번에 하나씩 가져오기
#    active: mysql
#    한번에 여러개 가져오기
#    include: mysql, mybatis
#    그룹으로 묶어서 여러개 가져오기
    active: prod
    group:
      dev:
        - h2
      prod:
        - mysql, mybatis


# 공통 설정
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  mvc:
    hiddenmethod:
      filter:
        enabled: true

server:
  port: 8080




