# 기존 properties 방식
#spring.application.name=backend
#
#server.port=8080
#
#spring.mvc.hiddenmethod.filter.enabled=true

# yaml 방식 사용하기
# 기존 application.properties 파일에서 확장자를 yml 로 변경하여 application.yml 로 사용 가능
# yaml 방식 사용 시 중복되는 패키지명을 모아서 사용
# 패키지명 끝에 ':' 을 사용하고 다음 라인으로 이동하여 들여쓰기로 구분
# 값이 들어가는 패키지는 '=' 대신 ':' 을 사용 후 반드시 공백 기호를 추가하고 값 입력

#server.port=8080
server:
  port: 8080

#spring.application.name=backend
spring:
  application:
    name: backend

#spring.mvc.hiddenmethod.filter.enabled=true
  mvc:
    hiddenmethod:
      filter:
        enabled: true

